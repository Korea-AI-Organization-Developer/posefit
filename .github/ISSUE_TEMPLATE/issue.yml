name: 이슈
description: 작업 내용을 간단히 기록합니다
body:
  - type: textarea
    id: work-description
    attributes:
      label: 작업 내용
      placeholder: 무엇을 할 것인지 간단히 작성해주세요.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 작업 완료
        - label: 셀프 리뷰 완료
