# =============================================================================
# PoseFit API Specification (v0.2.0)
# 근거: docs/erd.sql (팀 회의 확정안) = backend/app/models/,
#       docs/requirements.md, docs/wireframe/
#
# 작성 순서 (프롬프트 §0):
#   (1) 화면(SCR) × 액션 → endpoint 매트릭스
#   (2) ERD 키 쿼리(Q-R*/Q-W*) → endpoint 매핑
#   (3) 실시간 파이프라인(START~STOP) 데이터 흐름
#   (4) components.schemas → paths
#
# v0.2.0 변경 (2026-06-10) — erd.sql / backend/app/models/ 확정안 반영:
#   - exercises: slug·difficulty·bodyPart·metricType·thumbnailUrl 제거
#     → id 로 식별, nameKo/nameEn, exerciseType(static|dynamic) 으로 정렬
#   - workout_sessions.status: 'failed' 제거 — 실패는 aborted 로 통합
#   - score/avgScore/bestScore: DECIMAL(5,2) → number (소수 둘째 자리)
#   - feedbacks: orderIndex·category·llmModel 제거 (ERD 미존재, 정렬은 id ASC)
#   - users.email 컬럼 없음 → User.email 은 social_accounts.provider_email 파생
#   - agreements(약관 동의)·user_details(신체 정보) 테이블 신설 → endpoint 추가,
#     registrationStep 에 agreements_required/detail_required 단계 추가
#   - 소셜 provider: google 단일화 (kakao 제거)
#   - keypoint_frames.bbox NULL 허용 → FrameInput.bbox optional
#
# 모든 effective URL 은 server URL 기준. 본 문서 paths 는 prefix(/api, /v1) 생략.
# =============================================================================
#
# -----------------------------------------------------------------------------
# (1) SCR × 액션 → endpoint
# -----------------------------------------------------------------------------
# SCR-01 로그인/회원가입
#   "Google 로그인" 클릭               → POST /auth/social/{provider}/callback
# SCR-02 약관 동의 (신규 가입)
#   필수+선택 약관 동의 제출            → POST /users/me/agreements
# SCR-03 기본정보 입력 (신규 가입)
#   생년월일·성별·키·체중 입력          → PUT  /users/me/detail
# SCR-04 얼굴 캡처 (신규 가입)
#   실시간 얼굴 감지 폴링 (1.5s 간격)   → POST /users/me/face/detect
#   정면 얼굴 등록                      → POST /users/me/face
#
# SCR-05 메인 대시보드
#   진입 — KPI 카드 3종                → GET  /users/me/dashboard
#   진입 — 최근 운동 기록 5건          → GET  /workout-sessions?limit=5
#   진입 — 30일 활동 캘린더            → GET  /reports/calendar?days=30
#   "운동 시작하기" 클릭                → (라우팅: SCR-06)
#   기록 행 클릭                       → (라우팅: SCR-09, GET /workout-sessions/{id})
#
# SCR-06 운동 선택
#   진입 — 활성 운동 카드 + 내 평균    → GET  /exercises?activeOnly=true
#   카드 클릭                          → (라우팅: SCR-07)
#
# SCR-07 정답 영상
#   진입 — 운동 메타데이터              → GET  /exercises/{id}
#   (선택) 정답 키포인트 prefetch       → GET  /exercises/{id}/reference-keypoints
#   "운동 시작" 클릭                    → (라우팅: SCR-08)
#
# SCR-08 운동 실행 (실시간 파이프라인 — 아래 (3) 참고)
#   START 클릭                         → POST /workout-sessions
#                                      → POST /workout-sessions/{id}:start
#   (서버 추론 시) 프레임 업로드        → POST /workout-sessions/{id}/frames
#   STOP 클릭                          → POST /workout-sessions/{id}:stop
#
# SCR-09 운동 결과
#   진입                               → GET  /workout-sessions/{id}
#                                      → GET  /workout-sessions/{id}/feedbacks
#   "영상 저장" 클릭                    → POST /workout-sessions/{id}/video:presign
#                                      → (클라이언트가 presigned URL 로 PUT)
#                                      → POST /workout-sessions/{id}:save
#   "종료" 클릭 (저장 X)                → DELETE /workout-sessions/{id}
#
# SCR-10 보고/히스토리
#   진입 — 통계 카드                   → GET  /reports/summary?period=week
#   진입 — 점수 추이 차트              → GET  /reports/score-trend?days=7
#   진입 — 저장 영상 목록              → GET  /workout-sessions?savedOnly=true
#   탭 전환 (일/주/월/누적)             → GET  /reports/summary?period=...
#   종목 필터                          → 위 모든 endpoint 에 exerciseId 쿼리 추가
#
# SCR-11 설정
#   진입 — 프로필(+신체 정보)          → GET    /users/me
#   진입 — 연결된 소셜 계정             → GET    /users/me/social-accounts
#   진입 — 약관 동의 상태               → GET    /users/me/agreements
#   진입 — 저장 영상 N개/M MB 표시      → GET    /users/me/videos:summary
#   닉네임 수정                        → PATCH  /users/me
#   신체 정보(키·몸무게 등) 수정        → PUT    /users/me/detail
#   마케팅 수신 동의 변경               → POST   /users/me/agreements
#   얼굴 재등록                        → PUT    /users/me/face
#   얼굴 데이터만 삭제                  → DELETE /users/me/face
#   소셜 추가 연동                     → POST   /users/me/social-accounts/{provider}:link
#   소셜 연동 해제                     → DELETE /users/me/social-accounts/{provider}
#   저장 영상 일괄 삭제                 → POST   /users/me/videos:purge
#   로그아웃                           → POST   /auth/logout
#   회원 탈퇴                          → DELETE /users/me
#
# -----------------------------------------------------------------------------
# (2) ERD 쿼리 → endpoint 매핑
# -----------------------------------------------------------------------------
#  Q-R1  최근 점수                        → GET /users/me/dashboard.recentScore
#  Q-R2  이번 주 운동 횟수                  → GET /users/me/dashboard.weeklySessionsCount
#  Q-R3  누적 운동 횟수                    → GET /users/me/dashboard.lifetimeSessionsCount
#  Q-R4  최근 N건                          → GET /workout-sessions?limit=5
#  Q-R5  30일 캘린더                       → GET /reports/calendar?days=30
#  Q-R6  운동 목록 + 사용자 평균            → GET /exercises?activeOnly=true (items[].userAvgScore)
#  Q-R7  운동 메타데이터                   → GET /exercises/{id}
#  Q-R8  사용자 얼굴 임베딩 조회            → (서버 내부, :start 처리에서 사용)
#  Q-R9  정답 키포인트 시퀀스              → GET /exercises/{id}/reference-keypoints
#                                            (ERD 미저장 — 정답 영상 전처리 산출물, 아래 비고)
#  Q-R10 단일 세션 + 피드백                → GET /workout-sessions/{id}
#                                            + GET /workout-sessions/{id}/feedbacks
#  Q-R11 주/월/누적 통계                   → GET /reports/summary?period=week|month|cumulative
#  Q-R12 점수 추이 차트                    → GET /reports/score-trend
#  Q-R13 저장 영상 목록                    → GET /workout-sessions?savedOnly=true
#  Q-R14 프로필 + 소셜                     → GET /users/me + GET /users/me/social-accounts
#  Q-R15 저장 영상 합계                    → GET /users/me/videos:summary
#  ------------------------------------------------------------------
#  Q-W1  가입 (users+social+agreements     → POST /auth/social/{provider}/callback
#         +details+face)                       (users+social_accounts 트랜잭션)
#                                          + POST /users/me/agreements  (agreements)
#                                          + PUT  /users/me/detail      (user_details)
#                                          + POST /users/me/face        (face_embeddings)
#  Q-W2  세션 생성                         → POST /workout-sessions
#  Q-W3  프레임 bulk insert (15+ FPS)      → POST /workout-sessions/{id}/frames
#  Q-W4  STOP 점수 산출 + 피드백 + daily_stats UPSERT → POST /workout-sessions/{id}:stop (서버 내부)
#  Q-W5  영상 저장 확정                    → POST /workout-sessions/{id}/video:presign
#                                          + POST /workout-sessions/{id}:save
#  Q-W6  얼굴 재등록                       → PUT  /users/me/face
#  Q-W7  영상 일괄 삭제                    → POST /users/me/videos:purge
#  Q-W8  회원 탈퇴                         → DELETE /users/me
#
# -----------------------------------------------------------------------------
# (3) 실시간 파이프라인 (START ~ STOP)
# -----------------------------------------------------------------------------
# 요구사항 §7.1 — 서버 추론(ViTPose-Base) 확정. 단, 클라이언트 추론 전환
# 가능성에 대비해 API 는 두 시나리오를 모두 수용한다.
#
#   [Client]                                            [Server]
#   ──────────────────────────────────────────────────────────────────────
#   SCR-07 "운동 시작" 클릭
#
#   POST /workout-sessions               ─────────►  workout_sessions insert
#     body: { exerciseId }                            (status=in_progress)
#                                        ◄─────  201 { id, status }
#
#   POST /workout-sessions/{id}:start    ─────────►  face_embeddings 조회 + 매칭
#     body: { faceFrame (jpeg, base64) }              tracker 초기화
#                                        ◄─────  200 { matched: true }
#                                          또는 422 FACE_NOT_DETECTED
#                                                  / MULTIPLE_FACES_DETECTED
#                                                  / FACE_MISMATCH
#                                          (이 경우 세션은 status=aborted)
#
#   ── 시나리오 A: 서버 추론 ─────────────────────────────────────────────
#   loop (15+ FPS, 0.5~2초 배치):
#     POST /workout-sessions/{id}/frames ──────────►  keypoint_frames bulk insert
#       body: { frames: [{frameIndex, timestampMs,    (이때 saved=false 가정;
#                         keypoints, bbox?}] }         최종 :save 결과에 따라 보존/폐기)
#                                        ◄─────  202 { accepted, frameErrors? }
#
#   ── 시나리오 B: 클라이언트 추론 (MediaPipe 등) ────────────────────────
#   (클라이언트가 로컬에서 추론, 메모리에 frames 누적, 서버 호출 없음)
#
#   STOP 클릭
#   POST /workout-sessions/{id}:stop     ─────────►  점수 산출 + 피드백 생성
#     body: {                                         workout_sessions UPDATE
#       frames?: [...]  // 시나리오 B 일괄 동봉       workout_daily_stats UPSERT
#     }
#                                        ◄─────  200 { session, feedbacks }
#
#   ── SCR-09 결과 화면 ─────────────────────────────────────────────────
#   "영상 저장" 선택 시:
#     POST /workout-sessions/{id}/video:presign  ──►  presigned URL 발급
#                                        ◄─────  200 { uploadUrl, objectKey,
#                                                       expiresAt }
#     PUT <uploadUrl> (binary)                ──►  object storage 직접 업로드
#     POST /workout-sessions/{id}:save     ─────►  saved=true 확정
#       body: { objectKey }                          keypoint_frames 영구 보관
#                                        ◄─────  200 { session }
#
#   "종료" 선택 시 (저장 X):
#     DELETE /workout-sessions/{id}        ─────►  keypoint_frames 즉시 삭제
#                                                   (saved=false 라이프사이클)
#                                        ◄─────  204
#
# WebSocket 채택 시 — 본 spec 본문에는 REST 만 유지하고,
# 파일 끝 부록의 x-websocket 섹션에 메시지 스펙을 별도 정의.
#
# =============================================================================

openapi: 3.1.0

info:
  title: PoseFit API
  version: 0.2.0
  description: |
    AI 기반 운동 자세 분석 및 피드백 서비스의 REST API.
    상세 설계 컨텍스트는 본 파일 상단 주석 (1)(2)(3) 참고.
    인증은 소셜 전용(Google). 비밀번호 endpoint 없음.
    응답 필드는 docs/erd.sql (= backend/app/models/) 컬럼과 1:1 정렬 — 예외는 Derived 표시.
  contact:
    name: PoseFit Team
  license:
    name: Proprietary

servers:
  # base path 는 모든 환경에서 /api/v1 로 통일 — 환경 전환 시 host 만 교체.
  #   /api : API 네임스페이스 (FastAPI include_router prefix="/api/v1")
  #   /v1  : API 버전 (breaking change 시 /v2 신설)
  # 아래 도메인은 직관성용 placeholder — 실제 보유/배포 도메인 확정 시 교체.
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://posefit.com/api/v1
    description: Production (placeholder)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 소셜 로그인 콜백·토큰 갱신·로그아웃 (SCR-01, SCR-11).
  - name: Users
    description: 본인 프로필·약관 동의·신체 정보·얼굴·소셜·영상 관리 (SCR-02~04 가입 단계, SCR-05 일부, SCR-11).
  - name: Exercises
    description: 운동 종목 카탈로그 및 정답 데이터 (SCR-06, SCR-07).
  - name: Sessions
    description: 운동 세션 라이프사이클 (SCR-08, SCR-09).
  - name: Frames
    description: 실시간 키포인트 프레임 업로드 (SCR-08, 서버 추론 시나리오).
  - name: Feedbacks
    description: 세션 피드백 조회 (SCR-09).
  - name: Reports
    description: 일/주/월/누적 통계·차트·캘린더 (SCR-05 일부, SCR-10).
  - name: Admin Auth
    description: |
      관리자 전용 로그인(이메일/비밀번호)·토큰 갱신·로그아웃. 소비자 Google 로그인과 분리.
      adminBearerAuth 토큰 사용. 별도 도메인(admin.posefit.com 등)에서 호출.
  - name: Admin Users
    description: 회원 목록·상세·상태(활성/정지/탈퇴) 변경 (운영 도구, Phase 2).
  - name: Admin Exercises
    description: 운동 종목 등록·수정·노출 토글·정답 영상 URL 관리 (운영 도구, Phase 2).
  - name: Admin LLM
    description: RAG 피드백 생성용 LLM 모델 레지스트리 및 활성 모델 교체 (운영 도구).
  - name: Admin Exports
    description: 운동 좌표(keypoint_frames) 내보내기 — 분석 모델 학습 데이터셋 구축용.
  - name: Admin Stats
    description: 운영 대시보드 집계(회원·세션·점수·추이).
  - name: Admin Audit
    description: 관리자 행위 감사 로그 조회 (super_admin).

paths:

  # ===========================================================================
  # Auth — SCR-01, SCR-11(로그아웃)
  # ===========================================================================
  /auth/social/{provider}/callback:
    post:
      tags: [Auth]
      operationId: socialLoginCallback
      security: []
      summary: 소셜 로그인 콜백 — 가입 또는 로그인
      description: |
        프론트엔드가 OAuth provider 로부터 받은 authorization code 를 전달.
        서버가 provider 와 토큰 교환 후 사용자를 생성하거나 식별하여 JWT 발급.
        신규 사용자면 `isNewUser=true` — 클라이언트는 registrationStep 에 따라
        약관 동의(`/users/me/agreements`) → 기본 정보(`/users/me/detail`)
        → 얼굴 등록(`/users/me/face`) 순으로 진행.
      parameters:
        - $ref: '#/components/parameters/SocialProvider'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSocialCallbackRequest'
            example:
              code: "4/0AeaYSHB3..."
              redirectUri: "https://posefit.app/auth/callback"
      responses:
        '200':
          description: 로그인 또는 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSocialCallbackResponse'
              example:
                accessToken: "eyJhbGciOi..."
                refreshToken: "eyJhbGciOi..."
                accessTokenExpiresIn: 900
                isNewUser: true
                user:
                  id: 1024
                  email: "honggildong@gmail.com"
                  nickname: "홍길동"
                  role: "user"
                  status: "active"
                  registrationStep: "agreements_required"
                  detail: null
                  createdAt: "2026-05-26T09:12:33Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      security: []
      summary: Access token 재발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
            example: { refreshToken: "eyJhbGciOi..." }
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
              example:
                accessToken: "eyJhbGciOi..."
                accessTokenExpiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 — 현재 refresh token 무효화
      responses:
        '204': { description: 무효화 완료 }
        '401':
          $ref: '#/components/responses/Unauthorized'
  # ===========================================================================
  # Users — SCR-02~04(가입 단계), SCR-05 일부, SCR-11
  # ===========================================================================
  /users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: 본인 프로필 조회 (SCR-11 진입)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1024
                email: "honggildong@gmail.com"
                nickname: "홍길동"
                role: "user"
                status: "active"
                registrationStep: "complete"
                detail:
                  height: 175.5
                  weight: 70.2
                  birthdate: "1995-03-14"
                  gender: "M"
                createdAt: "2026-02-14T03:21:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      operationId: updateMe
      summary: 프로필 수정 (현재는 nickname 만)
      description: 신체 정보(키·몸무게 등)는 `PUT /users/me/detail` 사용.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example: { nickname: "홍길동2" }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1024
                email: "honggildong@gmail.com"
                nickname: "홍길동2"
                role: "user"
                status: "active"
                registrationStep: "complete"
                detail:
                  height: 175.5
                  weight: 70.2
                  birthdate: "1995-03-14"
                  gender: "M"
                createdAt: "2026-02-14T03:21:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      operationId: withdrawMe
      summary: 회원 탈퇴 (soft) — status=withdrawn 후 grace period 경과 시 hard delete
      description: users.withdrawn_at 에 탈퇴 시각 기록. 영구 삭제는 배치.
      responses:
        '204': { description: 탈퇴 처리 완료 (영구 삭제는 배치) }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/dashboard:
    get:
      tags: [Users]
      operationId: getDashboard
      summary: 대시보드 KPI + 최근 N건 (Q-R1~R3 + Q-R4 요약)
      description: |
        SCR-05 진입 시 단일 호출. 페이지네이션이 필요하면 `GET /workout-sessions` 별도 호출.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
              example:
                recentScore: 87.5
                weeklySessionsCount: 4
                lifetimeSessionsCount: 23
                recentSessions:
                  - id: 50211
                    exercise: { id: 1, nameKo: "스쿼트" }
                    status: "completed"
                    startedAt: "2026-05-25T09:28:00Z"
                    endedAt: "2026-05-25T09:30:14Z"
                    durationSec: 134
                    score: 92.25
                    repCount: 8
                    saved: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/agreements:
    get:
      tags: [Users]
      operationId: getMyAgreements
      summary: 최신 약관 동의 상태 조회 (SCR-11)
      description: agreements 는 append-only — 가장 최근 레코드 1건을 반환.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
              example:
                id: 311
                tosAgreed: true
                privacyAgreed: true
                biometricAgreed: true
                marketingAgreed: false
                agreedAt: "2026-05-26T09:12:50Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Users]
      operationId: submitAgreements
      summary: 약관 동의 제출 (SCR-02 가입 단계·SCR-11 동의 변경 공통)
      description: |
        신규 가입 흐름의 첫 단계 (registrationStep=agreements_required).
        동의 변경(마케팅 수신 토글 등) 시에도 새 레코드를 append — 기존 레코드는 이력으로 보존.
        필수 3종(tos/privacy/biometric)이 모두 true 가 아니면 422 AGREEMENT_REQUIRED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementCreateRequest'
            example:
              tosAgreed: true
              privacyAgreed: true
              biometricAgreed: true
              marketingAgreed: false
      responses:
        '201':
          description: 동의 기록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
              example:
                id: 311
                tosAgreed: true
                privacyAgreed: true
                biometricAgreed: true
                marketingAgreed: false
                agreedAt: "2026-05-26T09:12:50Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            필수 약관(tos/privacy/biometric) 중 하나라도 false — AGREEMENT_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: "https://posefit.app/errors/agreement-required"
                title: "Required agreement missing"
                status: 422
                code: "AGREEMENT_REQUIRED"
                detail: "서비스 이용을 위해 필수 약관에 모두 동의해야 합니다."
                traceId: "01HF9..."
  /users/me/detail:
    put:
      tags: [Users]
      operationId: upsertMyDetail
      summary: 신체 정보 등록·수정 (SCR-03 가입 단계·SCR-11 설정 공통)
      description: |
        user_details 는 users 와 1:1 — 없으면 생성, 있으면 전체 교체(upsert).
        가입 흐름에서는 registrationStep=detail_required 단계에서 호출.
        birthdate·gender 는 필수(ERD NOT NULL), height·weight 는 선택.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDetailUpsertRequest'
            example:
              height: 175.5
              weight: 70.2
              birthdate: "1995-03-14"
              gender: "M"
      responses:
        '200':
          description: 등록 또는 갱신 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
              example:
                height: 175.5
                weight: 70.2
                birthdate: "1995-03-14"
                gender: "M"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/face:
    post:
      tags: [Users]
      operationId: registerFace
      summary: 얼굴 임베딩 등록 (SCR-04, 가입 마지막 단계 1회)
      description: |
        AUTH-03. 신규 가입 흐름의 마지막 단계 (registrationStep=face_required).
        이미 등록되어 있으면 409 FACE_ALREADY_REGISTERED (재등록은 PUT 사용).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceRegistrationForm'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceRegistrationResponse'
              example:
                registeredAt: "2026-05-26T09:13:10Z"
                modelVersion: "dlib-v1"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Users]
      operationId: replaceFace
      summary: 얼굴 재등록 (SCR-11)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceRegistrationForm'
      responses:
        '200':
          description: 재등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceRegistrationResponse'
              example:
                registeredAt: "2026-05-26T09:30:00Z"
                modelVersion: "dlib-v1"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Users]
      operationId: deleteFace
      summary: 얼굴 데이터만 삭제 (SCR-11) — 계정은 유지
      description: 삭제 후 운동 endpoint 호출 시 422 FACE_REQUIRED.
      responses:
        '204': { description: 삭제 완료 }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/face/detect:
    post:
      tags: [Users]
      operationId: detectFace
      summary: 웹캠 프레임에 얼굴 1개 있는지 감지 (가입 SCR-04 실시간 피드백)
      description: |
        임베딩 추출 없이 얼굴 위치(HOG 검출)만 확인하므로 빠름 (~100ms).
        클라이언트가 1.5초 간격으로 폴링해 타원 오버레이 색상(빨강↔초록)을 갱신.
        인증 필요 — 미로그인 상태에서는 401.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceRegistrationForm'
      responses:
        '200':
          description: 감지 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceDetectResponse'
              examples:
                detected:
                  summary: 얼굴 1개 감지됨
                  value: { detected: true }
                not_detected:
                  summary: 얼굴 없음 또는 2명 이상
                  value: { detected: false }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/social-accounts:
    get:
      tags: [Users]
      operationId: listMySocialAccounts
      summary: 연결된 소셜 계정 목록 (SCR-11)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialAccount'
              example:
                - provider: "google"
                  providerEmail: "honggildong@gmail.com"
                  linkedAt: "2026-02-14T03:21:00Z"
                - provider: "google"
                  providerEmail: "hong.backup@gmail.com"
                  linkedAt: "2026-04-01T11:08:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/social-accounts/{provider}:link:
    post:
      tags: [Users]
      operationId: linkSocialAccount
      summary: 소셜 계정 추가 연동 (SCR-11)
      description: |
        동일 provider 라도 provider_uid 가 다른 계정이면 추가 연동 가능
        (UNIQUE 는 provider+provider_uid).
      parameters:
        - $ref: '#/components/parameters/SocialProvider'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSocialCallbackRequest'
            example:
              code: "AAAA..."
              redirectUri: "https://posefit.app/settings/social/callback"
      responses:
        '201':
          description: 연동 추가 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccount'
              example:
                provider: "google"
                providerEmail: "hong.backup@gmail.com"
                linkedAt: "2026-05-26T09:40:12Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/social-accounts/{provider}:
    delete:
      tags: [Users]
      operationId: unlinkSocialAccount
      summary: 소셜 계정 연동 해제 (SCR-11)
      description: |
        도메인 invariant — 마지막 1개 연동 해제는 거부 (409 LAST_SOCIAL_ACCOUNT).
        탈퇴를 원하면 `DELETE /users/me`.
      parameters:
        - $ref: '#/components/parameters/SocialProvider'
      responses:
        '204': { description: 해제 완료 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/videos:summary:
    get:
      tags: [Users]
      operationId: getMyVideosSummary
      summary: 저장 영상 합계 (SCR-11의 "총 12개 영상 · 약 248MB" 라인)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideosSummaryResponse'
              example: { count: 12, totalBytes: 260046848 }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/videos:purge:
    post:
      tags: [Users]
      operationId: purgeMyVideos
      summary: 저장 영상 일괄 삭제 (SCR-11)
      description: |
        모든 saved=true 세션의 video_url 을 NULL 로, saved=false 로 전환.
        keypoint_frames 도 보존 정책에 따라 함께 삭제. 스토리지 객체는 비동기 cleanup.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 삭제 작업 접수 (비동기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeAcceptedResponse'
              example: { purgedSessionsCount: 12, freedBytes: 260046848 }
        '401':
          $ref: '#/components/responses/Unauthorized'
  # ===========================================================================
  # Exercises — SCR-06, SCR-07
  # ===========================================================================
  /exercises:
    get:
      tags: [Exercises]
      operationId: listExercises
      summary: 운동 종목 목록 (Q-R6) — SCR-06
      description: |
        `userAvgScore` 는 호출자 본인의 평균(workout_daily_stats 집계).
      parameters:
        - name: activeOnly
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: false 면 비활성 종목도 포함 (admin 화면 대비).
          example: true
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
              example:
                items:
                  - id: 1
                    nameKo: "스쿼트"
                    nameEn: "Squat"
                    exerciseType: "dynamic"
                    isActive: true
                    userAvgScore: 84.5
                  - id: 2
                    nameKo: "플랭크"
                    nameEn: "Plank"
                    exerciseType: "static"
                    isActive: true
                    userAvgScore: 89.25
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /exercises/{id}:
    get:
      tags: [Exercises]
      operationId: getExercise
      summary: 운동 종목 상세 (Q-R7) — SCR-07
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
              example:
                id: 1
                nameKo: "스쿼트"
                nameEn: "Squat"
                description: "기본 하체 운동. 무릎과 발끝의 방향을 일치시키고 ..."
                referenceVideoUrl: "https://cdn.posefit.app/ex/squat.mp4"
                exerciseType: "dynamic"
                isActive: true
        '404':
          $ref: '#/components/responses/NotFound'
  /exercises/{id}/reference-keypoints:
    get:
      tags: [Exercises]
      operationId: getExerciseReferenceKeypoints
      summary: 정답 키포인트 시퀀스 (Q-R9) — DTW 비교용
      description: |
        SCR-08 START 직전 클라이언트 prefetch 또는 클라이언트 추론 시나리오 비교용.
        서버 추론 시나리오에서는 호출 없이 서버가 직접 사용.
        ERD 미저장 — 정답 영상(exercises.reference_video_url) 전처리 산출물을
        오브젝트 스토리지/캐시에서 서빙 (Derived).
      parameters:
        - $ref: '#/components/parameters/ExerciseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceKeypointSequence'
              example:
                exerciseId: 1
                frameCount: 240
                frames:
                  - frameIndex: 0
                    keypoints: [[0.51, 0.12], [0.52, 0.18]]
                    bbox: [0.32, 0.05, 0.36, 0.92]
                  - frameIndex: 1
                    keypoints: [[0.51, 0.12], [0.52, 0.18]]
                    bbox: [0.32, 0.05, 0.36, 0.92]
        '404':
          $ref: '#/components/responses/NotFound'
  # ===========================================================================
  # Sessions — SCR-08, SCR-09, SCR-10(목록)
  # ===========================================================================
  /workout-sessions:
    get:
      tags: [Sessions]
      operationId: listWorkoutSessions
      summary: 운동 세션 목록 (Q-R4, Q-R13)
      description: |
        - SCR-05 대시보드 "최근 운동 기록" — limit=5
        - SCR-10 저장 영상 목록 — savedOnly=true
        정렬은 항상 endedAt DESC (in_progress 는 startedAt DESC). 임의 정렬 비허용.
      parameters:
        - name: savedOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
          example: false
        - name: exerciseId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: 종목 필터 (REP-07).
          example: 1
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: 시작일(KST, inclusive). 미래 날짜는 422.
          example: "2026-05-01"
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: 종료일(KST, inclusive).
          example: "2026-05-31"
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionListResponse'
              example:
                items:
                  - id: 50211
                    exercise: { id: 1, nameKo: "스쿼트" }
                    status: "completed"
                    startedAt: "2026-05-25T09:28:00Z"
                    endedAt: "2026-05-25T09:30:14Z"
                    durationSec: 134
                    score: 92.25
                    repCount: 8
                    saved: true
                nextCursor: "eyJpZCI6NTAyMDh9"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Sessions]
      operationId: createWorkoutSession
      summary: 운동 세션 생성 (Q-W2) — START 클릭 직후
      description: |
        status=in_progress 로 row 생성. 이후 `:start` 호출로 얼굴 매칭·트래킹 시작.
        진행 중 세션이 이미 있으면 409 SESSION_ALREADY_ACTIVE.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSessionCreateRequest'
            example: { exerciseId: 1 }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSession'
              example:
                id: 50220
                exercise: { id: 1, nameKo: "스쿼트" }
                status: "in_progress"
                startedAt: "2026-05-26T09:45:00Z"
                endedAt: null
                durationSec: null
                score: null
                repCount: null
                holdSec: null
                saved: false
                videoUrl: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workout-sessions/{id}:
    get:
      tags: [Sessions]
      operationId: getWorkoutSession
      summary: 세션 단건 조회 (Q-R10) — SCR-09 진입
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSession'
              example:
                id: 50211
                exercise: { id: 1, nameKo: "스쿼트" }
                status: "completed"
                startedAt: "2026-05-25T09:28:00Z"
                endedAt: "2026-05-25T09:30:14Z"
                durationSec: 134
                score: 92.25
                repCount: 8
                holdSec: null
                saved: true
                videoUrl: "https://media.posefit.app/sessions/50211.mp4"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sessions]
      operationId: deleteWorkoutSession
      summary: 세션 폐기 (SCR-09 "종료" — 저장 안 함)
      description: |
        saved=false 세션을 명시적으로 폐기. keypoint_frames · 임시 영상도 모두 삭제.
        이미 saved=true 인 세션 삭제는 먼저 videos:purge 후 가능.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: 폐기 완료 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workout-sessions/{id}:start:
    post:
      tags: [Sessions]
      operationId: startWorkoutSession
      summary: 얼굴 매칭 + 트래킹 시작 (EX-03)
      description: |
        업로드된 얼굴 프레임을 등록 임베딩과 매칭. 실패 시 세션을 status=aborted 로 전환.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
            example:
              faceFrameJpegBase64: "/9j/4AAQSkZJRgABAQAAAQABAAD..."
      responses:
        '200':
          description: 매칭 성공 — 트래킹 진입
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSessionResponse'
              example:
                matched: true
                trackingStartedAt: "2026-05-26T09:45:03Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: |
            얼굴 인식 실패 — code 로 분기.
            FACE_NOT_DETECTED / MULTIPLE_FACES_DETECTED / FACE_MISMATCH / FACE_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: "https://posefit.app/errors/face-not-detected"
                title: "Face not detected"
                status: 422
                code: "FACE_NOT_DETECTED"
                detail: "프레임에서 얼굴을 찾을 수 없습니다. 조명을 확인하고 정면을 바라봐 주세요."
                traceId: "01HF8..."

  /workout-sessions/{id}:stop:
    post:
      tags: [Sessions]
      operationId: stopWorkoutSession
      summary: STOP — 점수 산출 + 피드백 생성 (Q-W4)
      description: |
        시나리오 B(클라이언트 추론) 이면 body 에 누적 frames 일괄 동봉.
        시나리오 A 면 body.frames 생략 (서버가 이미 받은 frames 로 산출).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopSessionRequest'
            example:
              frames: []
      responses:
        '200':
          description: 완료 — 점수와 피드백 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopSessionResponse'
              example:
                session:
                  id: 50220
                  exercise: { id: 1, nameKo: "스쿼트" }
                  status: "completed"
                  startedAt: "2026-05-26T09:45:00Z"
                  endedAt: "2026-05-26T09:47:14Z"
                  durationSec: 134
                  score: 87.5
                  repCount: 8
                  holdSec: null
                  saved: false
                  videoUrl: null
                feedbacks:
                  - id: 9001
                    severity: "info"
                    generatedBy: "rule"
                    content: "스쿼트 8회 중 6회는 자세가 매우 안정적이었습니다."
                    createdAt: "2026-05-26T09:47:14Z"
                  - id: 9002
                    severity: "warning"
                    generatedBy: "llm"
                    content: "3회차에서 무릎이 발끝보다 앞으로 나왔습니다. 무게중심을 뒤꿈치 쪽으로 두세요."
                    createdAt: "2026-05-26T09:47:14Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workout-sessions/{id}:save:
    post:
      tags: [Sessions]
      operationId: saveWorkoutSession
      summary: 영상 저장 확정 (EX-12) — saved=true 전환
      description: |
        선행 단계: `/workout-sessions/{id}/video:presign` 으로 받은 objectKey 를
        클라이언트가 직접 PUT 업로드한 뒤 본 endpoint 호출.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSessionRequest'
            example: { objectKey: "sessions/50220/video.mp4" }
      responses:
        '200':
          description: 저장 확정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSession'
              example:
                id: 50220
                exercise: { id: 1, nameKo: "스쿼트" }
                status: "completed"
                startedAt: "2026-05-26T09:45:00Z"
                endedAt: "2026-05-26T09:47:14Z"
                durationSec: 134
                score: 87.5
                repCount: 8
                holdSec: null
                saved: true
                videoUrl: "https://media.posefit.app/sessions/50220/video.mp4"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workout-sessions/{id}/video:presign:
    post:
      tags: [Sessions]
      operationId: presignVideoUpload
      summary: 영상 업로드용 presigned URL 발급
      parameters:
