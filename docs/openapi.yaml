      summary: 운동 좌표(keypoint_frames) 내보내기 (JSONL/JSON) — 감사 로그 기록
      description: |
        분석 모델 학습 데이터셋 구축용. sessionId 단건 또는 userId/exerciseId/기간 필터로 대량 내보내기.
        - format=jsonl: 프레임 1건 = 1줄(세션 메타 포함). 여러 세션 일괄.
        - format=json : 단일 sessionId 의 {session, frames[]} 구조.
        대량일 수 있어 StreamingResponse 로 전송한다.
      security:
        - adminBearerAuth: []
      parameters:
        - name: sessionId
          in: query
          schema: { type: integer, format: int64 }
          description: 단건 내보내기. 지정 시 다른 필터는 무시.
        - name: userId
          in: query
          schema: { type: integer, format: int64 }
        - name: exerciseId
          in: query
          schema: { type: integer, format: int64 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: format
          in: query
          schema:
            type: string
            enum: [jsonl, json]
            default: jsonl
      responses:
        '200':
          description: 스트리밍 좌표 데이터(파일 다운로드).
          content:
            application/x-ndjson:
              schema: { type: string }
            application/json:
              schema:
                $ref: '#/components/schemas/KeypointExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/stats/overview:
    get:
      tags: [Admin Stats]
      summary: 운영 대시보드 요약(회원·세션·평균 점수)
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: 요약 지표.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/stats/timeseries:
    get:
      tags: [Admin Stats]
      summary: 일별 가입·세션 추이
      security:
        - adminBearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 일별 추이 포인트.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsTimeseries'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/audit-logs:
    get:
      tags: [Admin Audit]
      summary: 관리자 감사 로그 (super_admin)
      security:
        - adminBearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/AdminPage' }
        - { $ref: '#/components/parameters/AdminSize' }
      responses:
        '200':
          description: 감사 로그 페이지.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  # ===========================================================================
  # Security
  # ===========================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authorization: Bearer <accessToken>.
        access 15분, refresh 14일 (refresh는 별도 endpoint).
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        관리자 Authorization: Bearer <adminAccessToken>.
        소비자 토큰과 JWT type(admin_access/admin_refresh)이 분리되어 상호 사용 불가.
        /admin/* 는 모두 이 스킴으로 보호된다.

  # ===========================================================================
  # Reusable parameters
  # ===========================================================================
  parameters:
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: ["string", "null"]
      description: 직전 응답의 nextCursor. 첫 페이지는 생략.
      example: "eyJpZCI6NTAyMDh9"

    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 50220

    ExerciseId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: exercises.id (BIGINT).
      example: 1

    SocialProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google]
      description: 현재 google 만 지원 (erd.sql provider 코멘트). DB 는 VARCHAR(20) — 추후 확장 가능.
      example: google

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: |
        24시간 내 동일 키로 재요청 시 같은 응답 반환.
        부작용 있는 POST 전반에 권장.
      example: "f0e1d2c3-b4a5-6789-0abc-def012345678"

    # ─── Admin (오프셋 페이지네이션 — 운영 도구용) ───
    AdminPage:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    AdminSize:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AdminUserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: users.id (BIGINT).
    LlmModelId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: llm_models.id (BIGINT).

  # ===========================================================================
  # Reusable responses (모든 4xx/5xx 는 $ref — 중복 정의 금지)
  # ===========================================================================
  responses:
    BadRequest:
      description: 잘못된 요청 (스키마/형식 오류)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://posefit.app/errors/bad-request"
            title: "Bad Request"
            status: 400
            code: "BAD_REQUEST"
            detail: "Request body did not match schema."
            errors:
              - field: "exerciseId"
                message: "must be a positive integer"

    Unauthorized:
      description: 인증 필요 또는 토큰 무효
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://posefit.app/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            code: "UNAUTHORIZED"
            detail: "Access token is missing or expired."

    Forbidden:
      description: "권한 없음 (예: 본인 외 사용자의 리소스)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://posefit.app/errors/forbidden"
            title: "Forbidden"
            status: 403
            code: "FORBIDDEN"
            detail: "You do not have access to this resource."

    NotFound:
      description: 리소스 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://posefit.app/errors/not-found"
            title: "Not Found"
            status: 404
            code: "NOT_FOUND"
            detail: "Workout session 50220 not found."

    Conflict:
      description: 상태 충돌 — 비즈니스 invariant 위반 시
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://posefit.app/errors/session-already-active"
            title: "Conflict"
            status: 409
            code: "SESSION_ALREADY_ACTIVE"
            detail: "An in_progress session already exists. Stop it before starting a new one."

    UnprocessableEntity:
      description: |
        검증 통과했으나 도메인 의미 처리 불가능. 예:
        FACE_NOT_DETECTED / FACE_MISMATCH / FACE_REQUIRED / AGREEMENT_REQUIRED /
        EXERCISE_INACTIVE / DATE_RANGE_IN_FUTURE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://posefit.app/errors/face-required"
            title: "Face data required"
            status: 422
            code: "FACE_REQUIRED"
            detail: "Register your face before starting a workout."

    RateLimited:
      description: Rate limit 초과
      headers:
        Retry-After:
          schema: { type: integer }
          description: 재시도까지 권장 대기(초).
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "https://posefit.app/errors/rate-limited"
            title: "Too Many Requests"
            status: 429
            code: "RATE_LIMITED"
            detail: "Slow down."

  # ===========================================================================
  # Schemas
  # ===========================================================================
  schemas:

    # ---- Error model (RFC 7807) -------------------------------------------
    Problem:
      type: object
      description: RFC 7807 Problem Details + 도메인 확장(code, traceId, errors).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: 오류 종류를 식별하는 URI.
        title:
          type: string
          description: 사람이 읽을 수 있는 짧은 요약.
        status:
          type: integer
          description: HTTP 상태 코드.
        detail:
          type: ["string", "null"]
          description: 사용자에게 보여줄 메시지.
        code:
          $ref: '#/components/schemas/ErrorCode'
        traceId:
          type: ["string", "null"]
          description: 분산 트레이싱 ID (CS 문의 대응용).
        errors:
          type: ["array", "null"]
          description: 필드별 검증 오류 (BadRequest 에 한정).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    ErrorCode:
      type: string
      description: 도메인 에러 키. 프론트엔드 분기 키로 안정 사용.
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        # 도메인
        - FACE_REQUIRED
        - FACE_ALREADY_REGISTERED
        - FACE_NOT_DETECTED
        - MULTIPLE_FACES_DETECTED
        - FACE_MISMATCH
        - AGREEMENT_REQUIRED
        - SESSION_ALREADY_ACTIVE
        - SESSION_NOT_IN_PROGRESS
        - SESSION_NOT_COMPLETED
        - EXERCISE_INACTIVE
        - LAST_SOCIAL_ACCOUNT
        - SOCIAL_ALREADY_LINKED
        - DATE_RANGE_IN_FUTURE
        - DATE_RANGE_INVALID
        - VIDEO_NOT_UPLOADED
        - VIDEO_TOO_LARGE
        - INVALID_OBJECT_KEY
        - WITHDRAWN_USER

    # ---- Auth -------------------------------------------------------------
    AuthSocialCallbackRequest:
      type: object
      description: 프론트엔드가 OAuth provider 의 redirect 에서 받은 code 를 전달.
      required: [code, redirectUri]
      properties:
        code:
          type: string
          description: OAuth authorization code.
        redirectUri:
          type: string
          format: uri
          description: OAuth 흐름에서 사용한 redirect_uri (provider 검증용).
        state:
          type: ["string", "null"]
          description: CSRF state (있을 경우).

    AuthSocialCallbackResponse:
      type: object
      description: 로그인 또는 가입 성공 시 토큰·사용자 합본.
      required: [accessToken, refreshToken, accessTokenExpiresIn, isNewUser, user]
      properties:
        accessToken:
          type: string
          description: JWT access (15분).
        refreshToken:
          type: string
          description: JWT refresh (14일).
        accessTokenExpiresIn:
          type: integer
          description: access 만료까지 초.
        isNewUser:
          type: boolean
          description: true 면 클라이언트는 registrationStep 에 따라 가입 단계로 이어진다.
        user:
          $ref: '#/components/schemas/User'

    AuthRefreshRequest:
      type: object
      description: refresh token 으로 access 재발급.
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthRefreshResponse:
      type: object
      description: 재발급된 access 토큰.
      required: [accessToken, accessTokenExpiresIn]
      properties:
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer }

    # ---- User -------------------------------------------------------------
    User:
      type: object
      description: 본인 프로필 (erd.sql users + 1:1 user_details 임베드). faceEmbedding 은 응답에 절대 포함되지 않음.
      required: [id, nickname, role, status, registrationStep, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: ["string", "null"]
          format: email
          description: |
            [PII][Derived] users 테이블 미저장 — 대표(최초 연동) social_accounts.provider_email.
            provider 가 이메일 미제공 시 NULL.
        avatarUrl:
          type: ["string", "null"]
          format: uri
          description: |
            [PII][Derived] users 테이블 미저장 — 대표(최초 연동) social_accounts.provider_avatar_url.
            구글 OAuth 의 picture URL(공개 핫링크). 로그인 시 갱신. 없으면 NULL → 클라이언트는 이니셜 아바타로 대체.
        nickname:
          type: string
          maxLength: 50
          description: 구글에서 받아온 이름이 기본.
        role:
          type: string
          enum: [user, admin]
          description: admin 은 Phase 2.
        status:
          type: string
          enum: [active, withdrawn]
        registrationStep:
          type: string
          enum: [agreements_required, detail_required, face_required, complete]
          description: |
            Derived (ERD 미저장) — 가입 진행 단계.
            필수 약관 동의(agreements) 없음 → agreements_required,
            user_details row 없음 → detail_required,
            face_embeddings row 없음 → face_required, 모두 충족 → complete.
        detail:
          description: user_details 1:1 임베드. 미입력(가입 진행 중) 시 NULL.
          anyOf:
            - $ref: '#/components/schemas/UserDetail'
            - type: "null"
        createdAt:
          type: string
          format: date-time

    UserUpdateRequest:
      type: object
      description: 닉네임만 수정 (현재). 신체 정보는 PUT /users/me/detail.
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 50

    UserDetail:
      type: object
      description: erd.sql user_details 와 1:1 (users 와 1:1 관계, user_id 가 PK).
      required: [height, weight, birthdate, gender]
      properties:
        height:
          type: ["number", "null"]
          minimum: 50
          maximum: 250
          description: cm. DECIMAL(4,1) — 소수 첫째 자리까지. 미입력 시 NULL.
        weight:
          type: ["number", "null"]
          minimum: 20
          maximum: 300
          description: kg. DECIMAL(4,1) — 소수 첫째 자리까지. 미입력 시 NULL.
        birthdate:
          type: string
          format: date
        gender:
          type: string
          enum: [M, F, U]
          description: M=남성, F=여성, U=선택 안 함.

    UserDetailUpsertRequest:
      type: object
      description: 신체 정보 등록·수정 (전체 교체). birthdate·gender 필수 (ERD NOT NULL).
      required: [birthdate, gender]
      properties:
        height:
          type: ["number", "null"]
          minimum: 50
          maximum: 250
          description: cm. 소수 첫째 자리까지.
        weight:
          type: ["number", "null"]
          minimum: 20
          maximum: 300
          description: kg. 소수 첫째 자리까지.
        birthdate:
          type: string
          format: date
          description: 미래 날짜 불가.
        gender:
          type: string
          enum: [M, F, U]

    # ---- Agreement --------------------------------------------------------
    Agreement:
      type: object
      description: erd.sql agreements 와 1:1. append-only — 최신 1건이 현재 동의 상태.
      required: [id, tosAgreed, privacyAgreed, biometricAgreed, marketingAgreed, agreedAt]
      properties:
        id:
          type: integer
          format: int64
        tosAgreed:
          type: boolean
          description: 서비스 이용약관(필수).
        privacyAgreed:
          type: boolean
          description: 개인정보 수집·이용(필수).
        biometricAgreed:
          type: boolean
          description: 바이오정보(얼굴) 처리(필수).
        marketingAgreed:
          type: boolean
          description: 마케팅 수신(선택).
        agreedAt:
          type: string
          format: date-time

    AgreementCreateRequest:
      type: object
      description: |
        약관 동의 제출. 필수 3종이 모두 true 가 아니면 422 AGREEMENT_REQUIRED.
      required: [tosAgreed, privacyAgreed, biometricAgreed]
      properties:
        tosAgreed:
          type: boolean
          description: 서비스 이용약관(필수) — true 여야 함.
        privacyAgreed:
          type: boolean
          description: 개인정보 수집·이용(필수) — true 여야 함.
        biometricAgreed:
          type: boolean
          description: 바이오정보(얼굴) 처리(필수) — true 여야 함.
        marketingAgreed:
          type: boolean
          default: false
          description: 마케팅 수신(선택).

    DashboardResponse:
      type: object
      description: SCR-05 대시보드 단건 합본 응답.
      required: [weeklySessionsCount, lifetimeSessionsCount, recentSessions]
      properties:
        recentScore:
          type: ["number", "null"]
          description: 최근 completed 세션 점수 (DECIMAL(5,2)). 없으면 NULL.
        weeklySessionsCount:
          type: integer
          description: 이번 주(월~일, KST) 세션 수.
        lifetimeSessionsCount:
          type: integer
        recentSessions:
          type: array
          description: 최근 N건의 축약 세션 (기본 5건).
          items:
            $ref: '#/components/schemas/WorkoutSessionSummary'
    # ---- Social account ---------------------------------------------------
    SocialAccount:
      type: object
      description: 연결된 소셜 계정 1건. erd.sql social_accounts 와 1:1 (provider_uid 는 노출 안 함).
      required: [provider, linkedAt]
      properties:
        provider:
          type: string
          enum: [google]
        providerEmail:
          type: ["string", "null"]
          format: email
          description: "[PII] 소셜 측 이메일. NULL 가능."
        linkedAt:
          type: string
          format: date-time
          description: 최초 연동 시각 (social_accounts.created_at).

    # ---- Face -------------------------------------------------------------
    FaceRegistrationForm:
      type: object
      description: multipart/form-data 의 JPEG/PNG 정면 얼굴 이미지.
      required: [image]
      properties:
        image:
          type: string
          format: binary

    FaceDetectResponse:
      type: object
      description: |
        얼굴 감지 결과. `detected=true` 면 프레임에 얼굴이 정확히 1개 있음.
        얼굴이 없거나 2명 이상이면 `detected=false`.
      required: [detected]
      properties:
        detected:
          type: boolean

    FaceRegistrationResponse:
      type: object
      description: 얼굴 임베딩 등록·재등록 응답. 임베딩 자체는 노출 안 함.
      required: [registeredAt, modelVersion]
      properties:
        registeredAt:
          type: string
          format: date-time
        modelVersion:
          type: string
          description: 임베딩 추출 모델 버전 (face_embeddings.model_version). 동일 버전끼리만 비교 유효.

    # ---- Videos summary / purge ------------------------------------------
    VideosSummaryResponse:
      type: object
      description: 저장 영상 합계 (개수·바이트).
      required: [count, totalBytes]
      properties:
        count:
          type: integer
          description: saved=true 세션 수.
        totalBytes:
          type: integer
          format: int64

    PurgeAcceptedResponse:
      type: object
      description: 영상 일괄 삭제 접수 결과.
      required: [purgedSessionsCount, freedBytes]
      properties:
        purgedSessionsCount: { type: integer }
        freedBytes: { type: integer, format: int64 }

    # ---- Exercise ---------------------------------------------------------
    Exercise:
      type: object
      description: 운동 종목 상세. erd.sql exercises 와 1:1.
      required: [id, nameKo, exerciseType, isActive]
      properties:
        id:
          type: integer
          format: int64
        nameKo:
          type: string
          maxLength: 100
          description: 표시 이름(한글).
        nameEn:
          type: ["string", "null"]
          maxLength: 100
          description: 표시 이름(영문).
        description:
          type: ["string", "null"]
        referenceVideoUrl:
          type: ["string", "null"]
          format: uri
          description: 정답(모범) 영상 URL.
        exerciseType:
          type: string
          enum: [static, dynamic]
          description: 정적운동(자세 유지, holdSec) static | 동적운동(반복, repCount) dynamic.
        isActive:
          type: boolean
          description: 운동 종목 노출 여부.

    ExerciseSummary:
      type: object
      description: 목록용 축약. userAvgScore 는 호출자 본인 평균(derived).
      required: [id, nameKo, exerciseType, isActive]
      properties:
        id:
          type: integer
          format: int64
        nameKo: { type: string }
        nameEn:
          type: ["string", "null"]
        exerciseType:
          type: string
          enum: [static, dynamic]
        isActive:
          type: boolean
        userAvgScore:
          type: ["number", "null"]
          description: Derived — workout_daily_stats 집계 (DECIMAL(5,2)). 미수행 종목은 NULL.

    ExerciseListResponse:
      type: object
      description: 운동 목록 페이지네이션 응답.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSummary'
        nextCursor:
          type: ["string", "null"]

    ReferenceKeypointFrame:
      type: object
      description: 정답 영상 한 프레임의 키포인트 + bbox.
      required: [frameIndex, keypoints]
      properties:
        frameIndex: { type: integer }
        keypoints:
          type: array
          description: 17개 관절 [x, y] 정규화 좌표 (0~1).
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 2
        bbox:
          type: ["array", "null"]
          description: "[x, y, w, h] 정규화."
          items: { type: number }
          minItems: 4
          maxItems: 4

    ReferenceKeypointSequence:
      type: object
      description: |
        운동 정답 영상의 키포인트 전체 시퀀스.
        Derived — ERD 미저장. 정답 영상 전처리 산출물(오브젝트 스토리지/캐시).
      required: [exerciseId, frameCount, frames]
      properties:
        exerciseId:
          type: integer
          format: int64
        frameCount: { type: integer }
        frames:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceKeypointFrame'
    # ---- Session ----------------------------------------------------------
    EmbeddedExercise:
      type: object
      description: 세션·리포트 응답에 임베드되는 운동 축약(id + nameKo).
      required: [id, nameKo]
      properties:
        id:
          type: integer
          format: int64
        nameKo: { type: string }

    WorkoutSession:
      type: object
      description: 세션 상세. erd.sql workout_sessions + 임베드 exercise.
      required: [id, exercise, status, startedAt, saved]
      properties:
        id:
          type: integer
          format: int64
        exercise:
          $ref: '#/components/schemas/EmbeddedExercise'
        status:
          type: string
          enum: [in_progress, completed, aborted]
          description: 얼굴 매칭 실패 등 비정상 종료도 aborted.
        startedAt:
          type: string
          format: date-time
          description: 세션 시작 시각(UTC).
        endedAt:
          type: ["string", "null"]
          format: date-time
          description: 세션 종료 시각(UTC). 진행 중이면 NULL.
        durationSec:
          type: ["integer", "null"]
          description: Derived — ended_at − started_at (초).
        score:
          type: ["number", "null"]
          description: 0~100점, DECIMAL(5,2) — 소수 둘째 자리까지. completed 일 때만.
        repCount:
          type: ["integer", "null"]
          description: 반복 횟수 (exerciseType=dynamic).
        holdSec:
          type: ["integer", "null"]
          description: 자세 유지 시간(초) (exerciseType=static).
        saved:
          type: boolean
        videoUrl:
          type: ["string", "null"]
          format: uri
          description: "[PII] saved=true 시에만 채움."

    WorkoutSessionSummary:
      type: object
      description: 목록·대시보드용 축약. videoUrl/holdSec 제외.
      required: [id, exercise, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
        exercise:
          $ref: '#/components/schemas/EmbeddedExercise'
        status:
          type: string
          enum: [in_progress, completed, aborted]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        durationSec:
          type: ["integer", "null"]
          description: Derived — ended_at − started_at (초).
        score:
          type: ["number", "null"]
          description: 0~100점 (DECIMAL(5,2)).
        repCount:
          type: ["integer", "null"]
        saved:
          type: boolean

    WorkoutSessionListResponse:
      type: object
      description: 세션 목록 페이지네이션 응답.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSessionSummary'
        nextCursor:
          type: ["string", "null"]

    WorkoutSessionCreateRequest:
      type: object
      description: 세션 생성 요청. exerciseId 만 받는다.
      required: [exerciseId]
      properties:
        exerciseId:
          type: integer
          format: int64

    StartSessionRequest:
      type: object
      description: 얼굴 매칭용 단일 프레임을 base64 로 동봉.
      required: [faceFrameJpegBase64]
      properties:
        faceFrameJpegBase64:
          type: string
          description: data URI 의 base64 본문만(prefix 없이).

    StartSessionResponse:
      type: object
      description: 얼굴 매칭 성공 + 트래킹 시작 응답.
      required: [matched, trackingStartedAt]
      properties:
        matched:
          type: boolean
        trackingStartedAt:
          type: string
          format: date-time

    FrameInput:
      type: object
      description: 단일 프레임 입력(클라/서버 추론 공통 입력 형식). erd.sql keypoint_frames 와 1:1.
      required: [frameIndex, timestampMs, keypoints]
      properties:
        frameIndex:
          type: integer
          description: 세션 내 프레임 인덱스(0부터 시작).
        timestampMs:
          type: integer
          format: int64
          description: started_at 기준 경과 ms.
        keypoints:
          type: array
          description: 정규화된 관절 키포인트(0~1).
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 2
        bbox:
          type: ["array", "null"]
          description: "사람 바운딩 박스 [x, y, w, h]. 미검출 시 NULL 허용 (ERD NULL)."
          items: { type: number }
          minItems: 4
          maxItems: 4

    FrameBatchRequest:
      type: object
      description: 1~200 프레임의 chunked 배치.
      required: [frames]
      properties:
        frames:
          type: array
          items:
            $ref: '#/components/schemas/FrameInput'
          minItems: 1
          maxItems: 200

    FrameBatchResponse:
      type: object
      description: 배치 수신 결과. 선택적으로 프레임별 오차 즉시 반환 가능.
      required: [accepted, rejected]
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        frameErrors:
          type: ["array", "null"]
          items:
            type: object
            required: [frameIndex, error]
            properties:
              frameIndex: { type: integer }
              error: { type: number }

    StopSessionRequest:
      type: object
      description: |
        시나리오 B(클라이언트 추론) 면 누적 frames 일괄 동봉.
        시나리오 A(서버 추론) 면 frames 생략.
      properties:
        frames:
          type: ["array", "null"]
          items:
            $ref: '#/components/schemas/FrameInput'
          maxItems: 5000

    StopSessionResponse:
      type: object
      description: STOP 처리 결과 — 세션 + 피드백 합본.
      required: [session, feedbacks]
      properties:
        session:
          $ref: '#/components/schemas/WorkoutSession'
        feedbacks:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
    SaveSessionRequest:
      type: object
      description: presign 응답의 objectKey 를 그대로 전달.
      required: [objectKey]
      properties:
        objectKey:
          type: string

    VideoPresignRequest:
      type: object
      description: 영상 업로드 presigned URL 발급 요청.
      required: [contentType, sizeBytes]
      properties:
        contentType:
          type: string
          enum: ["video/mp4", "video/webm"]
        sizeBytes:
          type: integer
          format: int64
          maximum: 524288000
          description: 최대 500MB.

    VideoPresignResponse:
      type: object
      description: presigned URL 발급 결과.
      required: [uploadUrl, objectKey, method, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        objectKey:
          type: string
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties: { type: string }
          description: "PUT 시 함께 보내야 하는 헤더(예: Content-Type)."
        expiresAt:
          type: string
          format: date-time

    # ---- Feedback ---------------------------------------------------------
    Feedback:
      type: object
      description: erd.sql feedbacks 와 1:1. 표시 순서는 id ASC.
      required: [id, severity, generatedBy, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        severity:
          type: string
          enum: [info, warning, critical]
        generatedBy:
          type: string
          enum: [rule, llm]
        content:
          type: string
          description: 사용자에게 보여줄 자연어 피드백.
        createdAt:
          type: string
          format: date-time

    # ---- Reports ----------------------------------------------------------
    CalendarDay:
      type: object
      description: 캘린더 1일 단위. workout_daily_stats 일자 집계.
      required: [date, sessionsCount]
      properties:
        date:
          type: string
          format: date
          description: KST 일자.
        sessionsCount:
          type: integer
        avgScore:
          type: ["number", "null"]
          description: DECIMAL(5,2).

    CalendarResponse:
      type: object
      description: 활동 캘린더 응답.
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDay'
    ReportSummary:
      type: object
      description: |
        workout_daily_stats 집계. period 에 따라 합산 범위가 달라짐.
        cumulative 면 periodStart 는 가입일, periodEnd 는 오늘.
      required: [period, periodStart, periodEnd, sessionsCount, totalDurationSec]
      properties:
        period:
          type: string
          enum: [day, week, month, cumulative]
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        sessionsCount:
          type: integer
        totalDurationSec:
          type: integer
        avgScore:
          type: ["number", "null"]
          description: DECIMAL(5,2).
        bestExercise:
          type: ["object", "null"]
          description: 기간 내 최고 평균 점수 종목 (workout_daily_stats.best_score). 데이터 없으면 NULL.
          required: [id, nameKo, bestScore]
          properties:
            id:
              type: integer
              format: int64
            nameKo: { type: string }
            bestScore:
              type: number
              description: DECIMAL(5,2).

    ScoreTrendPoint:
      type: object
      description: 점수 추이 차트의 1포인트.
      required: [date, avgScore]
      properties:
        date:
          type: string
          format: date
        avgScore:
          type: number
          description: DECIMAL(5,2).

    ScoreTrendSeries:
      type: object
      description: 종목별 시계열.
      required: [exercise, points]
      properties:
        exercise:
          $ref: '#/components/schemas/EmbeddedExercise'
        points:
          type: array
          items:
            $ref: '#/components/schemas/ScoreTrendPoint'
    ScoreTrendResponse:
      type: object
      description: 종목별 시리즈 배열.
      required: [series]
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/ScoreTrendSeries'

    # =========================================================================
    # Admin schemas (운영 도구) — 응답 필드는 admin_accounts/llm_models/
    # admin_audit_logs (= erd.sql) 컬럼과 정렬, 예외는 Derived 표시.
    # =========================================================================
    Admin:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [super_admin, admin] }
        status: { type: string, enum: [active, disabled] }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AdminTokenResponse:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresIn, admin]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresIn: { type: integer, description: access 만료까지 초 }
        admin: { $ref: '#/components/schemas/Admin' }

    AdminRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AdminRefreshResponse:
      type: object
      required: [accessToken, accessTokenExpiresIn]
      properties:
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer }

    AdminPageMeta:
      type: object
      description: 오프셋 페이지네이션 공통 메타.
      required: [total, page, size]
      properties:
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }

    AdminUserListItem:
      type: object
      required: [id, nickname, role, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        email: { type: ["string", "null"], description: "Derived. 대표 social_accounts.provider_email" }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, suspended, withdrawn] }
        createdAt: { type: string, format: date-time }

    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/AdminPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminUserListItem' }

    AdminUserDetail:
      type: object
      required: [id, nickname, role, status, createdAt, faceRegistered, sessionCount]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        email: { type: ["string", "null"] }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, suspended, withdrawn] }
        createdAt: { type: string, format: date-time }
        withdrawnAt: { type: ["string", "null"], format: date-time }
        birthdate: { type: ["string", "null"], format: date }
        gender: { type: ["string", "null"], enum: [M, F, U, null] }
        height: { type: ["number", "null"] }
        weight: { type: ["number", "null"] }
        faceRegistered: { type: boolean, description: "Derived. face_embeddings row 존재" }
        marketingAgreed: { type: ["boolean", "null"], description: "Derived. 최신 agreements.marketing_agreed" }
        sessionCount: { type: integer, description: "Derived. workout_sessions count" }

    AdminUserUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended, withdrawn] }

    AdminExercise:
      type: object
      required: [id, nameKo, exerciseType, isActive]
      properties:
        id: { type: integer, format: int64 }
        nameKo: { type: string }
        nameEn: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        referenceVideoUrl: { type: ["string", "null"] }
        exerciseType: { type: string, enum: [static, dynamic] }
        isActive: { type: boolean }

    AdminExerciseCreateRequest:
      type: object
      required: [nameKo]
      properties:
        nameKo: { type: string, maxLength: 100 }
        nameEn: { type: ["string", "null"], maxLength: 100 }
        description: { type: ["string", "null"] }
        referenceVideoUrl: { type: ["string", "null"], maxLength: 500 }
        exerciseType: { type: string, enum: [static, dynamic], default: dynamic }

    AdminExerciseUpdateRequest:
      type: object
      description: 부분 갱신 — 전달된 필드만 수정.
      properties:
        nameKo: { type: string, maxLength: 100 }
        nameEn: { type: ["string", "null"], maxLength: 100 }
        description: { type: ["string", "null"] }
        referenceVideoUrl: { type: ["string", "null"], maxLength: 500 }
        exerciseType: { type: string, enum: [static, dynamic] }
        isActive: { type: boolean }

    LlmModel:
      type: object
      required: [id, provider, modelName, displayName, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string, enum: [google, openai, anthropic] }
        modelName: { type: string, description: "API 식별자. 예: gemini-3.5-flash" }
        displayName: { type: string }
        params: { type: ["object", "null"], additionalProperties: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LlmModelCreateRequest:
      type: object
      required: [provider, modelName, displayName]
      properties:
        provider: { type: string, enum: [google, openai, anthropic] }
        modelName: { type: string, maxLength: 100 }
        displayName: { type: string, maxLength: 100 }
        params: { type: ["object", "null"], additionalProperties: true }

    AdminSessionListItem:
      type: object
      required: [id, userId, exercise, status, startedAt, saved]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        exercise: { $ref: '#/components/schemas/EmbeddedExercise' }
        status: { type: string, enum: [in_progress, completed, aborted] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        score: { type: ["number", "null"] }
        repCount: { type: ["integer", "null"] }
        holdSec: { type: ["integer", "null"] }
        saved: { type: boolean }

    AdminSessionPage:
      allOf:
        - $ref: '#/components/schemas/AdminPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminSessionListItem' }

    KeypointExport:
      type: object
      description: format=json (단일 세션) 응답 구조. format=jsonl 은 프레임 1건/1줄.
      required: [session, frames]
      properties:
        session:
          type: object
          properties:
            sessionId: { type: integer, format: int64 }
            userId: { type: integer, format: int64 }
            exerciseId: { type: integer, format: int64 }
            exerciseNameKo: { type: ["string", "null"] }
            status: { type: string }
            startedAt: { type: ["string", "null"], format: date-time }
            score: { type: ["number", "null"] }
        frames:
          type: array
          items:
            type: object
            properties:
              frameIndex: { type: integer }
              timestampMs: { type: integer, format: int64 }
              keypoints: { type: array, items: { type: array, items: { type: number } } }
              bbox: { type: ["array", "null"], items: { type: number } }

    StatsOverview:
      type: object
      required: [totalUsers, activeUsers, suspendedUsers, withdrawnUsers, totalSessions]
      properties:
        totalUsers: { type: integer }
        activeUsers: { type: integer }
        suspendedUsers: { type: integer }
        withdrawnUsers: { type: integer }
        totalSessions: { type: integer }
        avgScore: { type: ["number", "null"], description: "completed 세션 평균 점수" }

    StatsTimeseries:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            type: object
            required: [date, signups, sessions]
            properties:
              date: { type: string, format: date }
              signups: { type: integer }
              sessions: { type: integer }

    AuditLog:
      type: object
      required: [id, adminId, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        adminId: { type: integer, format: int64 }
        action: { type: string, description: "예: export_keypoints, activate_llm, update_user_status" }
        targetType: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        detail: { type: ["object", "null"], additionalProperties: true }
        ipAddress: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/AdminPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }
# =============================================================================
# (10) 안티패턴 자가점검
# =============================================================================
# [x] 필드명 일관성
#     — 세션 식별자는 path / response / request 모두 `id`. sessionId/workoutSessionId 혼용 없음.
#     — exerciseId 는 path·query·body 전부 동일 이름 (erd.sql exercises.id).
# [x] ERD 없는 필드는 derived 표시
#     — User.email, User.registrationStep, ExerciseSummary.userAvgScore,
#       WorkoutSession(Summary).durationSec, ReferenceKeypointSequence 만 derived.
#         schema description 에 "Derived" 라벨.
#     — 그 외 응답 필드는 모두 erd.sql 컬럼에 1:1 대응.
# [x] 4xx/5xx 응답은 components.responses 재사용
#     — BadRequest / Unauthorized / Forbidden / NotFound / Conflict /
#         UnprocessableEntity / RateLimited 전부 $ref.
#     — 인라인 4xx 응답은 :start 와 POST /users/me/agreements 의 422 두 곳뿐
#       (코드별 예시 다양화 목적).
# [x] 모든 200/201 응답에 example 포함
#     — 각 operation 의 응답에 example 명시.
# [x] enum 은 schema 차원 정의 + 재사용
#     — provider/role/status/gender/exerciseType/severity/generatedBy/
#         sessionStatus/period — schemas 또는 parameters 의 schema 에서 정의.
#     — path/query 인라인 enum 중복 없음.
# [x] 페이지네이션·정렬·필터 컨벤션 통일
#     — cursor + limit 으로 통일. items + nextCursor 응답 모양 통일.
#     — 정렬은 endpoint 고정 (sessions: endedAt DESC, feedbacks: id ASC). 외부 정렬 옵션 없음.
#     — 날짜 범위 from/to inclusive. 미래 날짜는 422 DATE_RANGE_IN_FUTURE.
# [x] PII 필드 노출 통제
#     — faceEmbedding(VARBINARY)·provider_uid: 응답 schema 어디에도 없음.
#     — email, providerEmail, videoUrl: schema description 에 [PII] 마킹.
# [x] operationId / tags 누락 없음
#     — 모든 operation 에 camelCase operationId + 적절한 tags.
# [x] path / query parameter 모두 정의 + example
#     — 공용은 components.parameters, 개별은 inline. 모두 example 보유.
# [x] securitySchemes 선언 + 인증 endpoint 만 security: [] 로 빼냄
#     — bearerAuth 전역. /auth/social/{provider}/callback, /auth/refresh 만 예외.
