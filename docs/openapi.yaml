#
# 단, 아래 2건은 "ERD 미저장이 의도"인지 다음 회의에서 확인 권장:
#   - 정답 키포인트 시퀀스 (GET /exercises/{id}/reference-keypoints)
#     → 현재 가정: 정답 영상 전처리 산출물을 오브젝트 스토리지/캐시로 서빙 (DB 미저장)
#   - 운동 카드 썸네일 (SCR-06) — exercises 에 thumbnail 컬럼 없음
#     → 현재 가정: 프론트 정적 자산 또는 reference_video_url 포스터 프레임 사용
#
# 본 명세의 derived 필드는 모두 application 단 계산이며, 어디서 도출되는지
# 각 schema description 에 명시:
#   - User.email                    → 대표(최초 연동) social_accounts.provider_email
#   - User.registrationStep         → agreements/user_details/face_embeddings row 존재 여부
#   - ExerciseSummary.userAvgScore  → workout_daily_stats 집계
#   - WorkoutSession.durationSec    → ended_at − started_at
#   - DashboardResponse.*           → workout_sessions + workout_daily_stats
#   - CalendarDay / ReportSummary / ScoreTrend* → workout_daily_stats
#   - ReferenceKeypointSequence     → 정답 영상 전처리 산출물 (오브젝트 스토리지/캐시)
