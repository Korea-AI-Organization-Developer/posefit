  # ===========================================================================
  # Frames — SCR-08 (서버 추론 시나리오)
  # ===========================================================================
  /workout-sessions/{id}/frames:
    post:
      tags: [Frames]
      operationId: uploadFrames
      summary: 키포인트 프레임 배치 업로드 (Q-W3, 서버 추론)
      description: |
        한 번에 1~2초 분량의 프레임을 묶어 보낸다 (chunked 권장).
        세션 status=in_progress 가 아니면 409.
        세션이 saved=false 로 종료될 경우 STOP 직후 frames 는 폐기됨(D-6).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameBatchRequest'
            example:
              frames:
                - frameIndex: 120
                  timestampMs: 8000
                  keypoints: [[0.52, 0.14], [0.51, 0.20]]
                  bbox: [0.30, 0.04, 0.40, 0.94]
                - frameIndex: 121
                  timestampMs: 8067
                  keypoints: [[0.52, 0.14], [0.51, 0.20]]
                  bbox: [0.30, 0.04, 0.40, 0.94]
      responses:
        '202':
          description: 수신 완료 (분석은 STOP 시점에 확정)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameBatchResponse'
              example:
                accepted: 2
                rejected: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
