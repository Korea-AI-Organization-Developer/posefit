  # ===========================================================================
  /reports/calendar:
    get:
      tags: [Reports]
      operationId: getActivityCalendar
      summary: 활동 캘린더 (Q-R5) — SCR-05 30일 그리드 + SCR-10 재사용
      parameters:
        - name: days
          in: query
          required: true
          schema: { type: integer, minimum: 7, maximum: 90 }
          description: 오늘부터 거슬러 N일 (KST).
          example: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
              example:
                days:
                  - date: "2026-04-27"
                    sessionsCount: 0
                    avgScore: null
                  - date: "2026-04-28"
                    sessionsCount: 1
                    avgScore: 81.5
                  - date: "2026-04-29"
                    sessionsCount: 2
                    avgScore: 88.25
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /reports/summary:
    get:
      tags: [Reports]
      operationId: getReportSummary
      summary: 기간 요약 (Q-R11) — SCR-10 통계 카드
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [day, week, month, cumulative]
          description: |
            - day: 단일 일자
            - week: 단일 주(월~일)
            - month: 단일 월
            - cumulative: 가입 이후 전체
          example: week
        - name: referenceDate
          in: query
          required: false
          schema: { type: string, format: date }
          description: 기준 일자(KST). period=cumulative 면 무시.
          example: "2026-05-26"
        - name: exerciseId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: 종목 필터 (REP-07).
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
              example:
                period: "week"
                periodStart: "2026-05-25"
                periodEnd: "2026-05-31"
                sessionsCount: 4
                totalDurationSec: 2520
                avgScore: 86.5
                bestExercise:
                  id: 1
                  nameKo: "스쿼트"
                  bestScore: 92.25
