<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 달력</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .calendar-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 2rem;
    width: 420px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  }

  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .cal-title { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .cal-stat  { font-size: 13px; color: #aaa; }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 1.25rem;
  }
  .cal-nav button {
    background: none; border: none; cursor: pointer;
    font-size: 18px; color: #888; padding: 2px 8px;
    border-radius: 6px; line-height: 1;
  }
  .cal-nav button:hover { background: #f0f0f0; }
  .cal-month {
    font-size: 14px; font-weight: 500; color: #333;
    min-width: 90px; text-align: center;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-dow {
    font-size: 12px; color: #bbb;
    text-align: center; padding: 4px 0 8px;
  }

  .cal-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    border: 2px solid transparent;
  }
  .cal-cell:hover {
    transform: scale(1.08);
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .cal-cell.empty { cursor: default; background: transparent !important; }
  .cal-cell.empty:hover { transform: none; box-shadow: none; }
  .cal-cell.today { border-color: #1D9E75; }

  .v0 { background: #EDEDEE; }
  .v1 { background: #C8EDE4; }
  .v2 { background: #8DD5C3; }
  .v3 { background: #46BBA2; }
  .v4 { background: #0D9B7B; }

  .legend {
    display: flex; align-items: center;
    justify-content: flex-end; gap: 6px; margin-top: 1.25rem;
  }
  .legend-label { font-size: 11px; color: #aaa; }
  .legend-box   { width: 15px; height: 15px; border-radius: 4px; }

  .stats-row { display: flex; gap: 10px; margin-bottom: 1.5rem; }
  .stat-box {
    background: #f5f5f5; border-radius: 10px;
    padding: 10px 14px; flex: 1;
  }
  .stat-num { font-size: 20px; font-weight: 600; color: #1a1a1a; }
  .stat-lbl { font-size: 11px; color: #999; margin-top: 2px; }

  /* 모달 (읽기 전용) */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    display: none; align-items: center;
    justify-content: center; z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px;
    padding: 1.5rem; width: 280px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }
  .modal-kcal {
    font-size: 12px; color: #0D9B7B; font-weight: 500;
    margin-bottom: 1rem;
  }
  .exercise-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .exercise-row {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: #f7f7f7; border-radius: 8px;
  }
  .exercise-left { display: flex; align-items: center; gap: 8px; }
  .exercise-icon { font-size: 15px; }
  .exercise-name { font-size: 13px; color: #333; }
  .exercise-value { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .no-record {
    text-align: center; color: #bbb;
    font-size: 13px; padding: 12px 0;
  }
  .modal-close {
    width: 100%; padding: 9px; border-radius: 8px;
    background: none; border: 1.5px solid #e8e8e8;
    font-size: 13px; color: #888; cursor: pointer;
    font-weight: 500;
  }
  .modal-close:hover { background: #f5f5f5; }
</style>
</head>
<body>

<div class="calendar-card">
  <div class="cal-header">
    <span class="cal-title">최근 활동</span>
    <span class="cal-stat" id="header-stat">0일 운동</span>
  </div>


  <div class="cal-nav">
    <button id="prev-btn">‹</button>
    <span class="cal-month" id="month-label"></span>
    <button id="next-btn">›</button>
  </div>

  <div class="cal-grid" id="cal-grid"></div>

  <div class="legend">
    <span class="legend-label">적음</span>
    <div class="legend-box" style="background:#EDEDEE"></div>
    <div class="legend-box" style="background:#C8EDE4"></div>
    <div class="legend-box" style="background:#8DD5C3"></div>
    <div class="legend-box" style="background:#46BBA2"></div>
    <div class="legend-box" style="background:#0D9B7B"></div>
    <span class="legend-label">많음</span>
  </div>
</div>

<!-- 날짜 클릭 시 운동 기록 조회 (읽기 전용) -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">운동 기록</h3>
    <div class="modal-kcal" id="modal-kcal"></div>
    <div class="exercise-list" id="modal-exercise-list"></div>
    <button class="modal-close" id="modal-close">닫기</button>
  </div>
</div>

<script>
  const DAYS = ['월','화','수','목','금','토','일'];

  // ─────────────────────────────────────────────────────────
  // [DB 연동 포인트 ①] 체중
  // 회원가입 시 저장된 체중을 여기에 주입
  // 예: const USER_WEIGHT = currentUser.weight;
  // ─────────────────────────────────────────────────────────
  const USER_WEIGHT = 70; // kg (임시 기본값)

  // 운동별 MET 기반 칼로리 계수 (kcal / kg / 횟수or초)
  // MET 공식: kcal = MET × 체중(kg) × 시간(h)
  const KCAL_PER_KG = {
    lunge:    0.00375,   // MET 4.5, 1회 ≈ 3초
    plank:    0.000833,  // MET 3.0, 1초
    pushup:   0.00444,   // MET 8.0, 1회 ≈ 2초
    overhead: 0.005,     // MET 6.0, 1회 ≈ 3초
  };

  function calcCalories(entry) {
    if (!entry) return 0;
    return Math.round((
      (entry.lunge    || 0) * KCAL_PER_KG.lunge    * USER_WEIGHT +
      (entry.plank    || 0) * KCAL_PER_KG.plank    * USER_WEIGHT +
      (entry.pushup   || 0) * KCAL_PER_KG.pushup   * USER_WEIGHT +
      (entry.overhead || 0) * KCAL_PER_KG.overhead * USER_WEIGHT
    ) * 10) / 10;
  }

  function colorLevel(kcal) {
    if (kcal <= 0)   return 0;
    if (kcal <= 50)  return 1;
    if (kcal <= 150) return 2;
    if (kcal <= 300) return 3;
    return 4;
  }

  // ─────────────────────────────────────────────────────────
  // [DB 연동 포인트 ②] 운동 기록 로드
  // 아래 data 객체를 API 응답으로 교체하면 됨
  //
  // async function loadData() {
  //   const res = await fetch('/api/v1/workouts/calendar', {
  //     headers: { Authorization: `Bearer ${localStorage.getItem('access_token')}` }
  //   });
  //   const { sessions } = await res.json();
  //   // sessions: [{ date:"2026-06-15", lunge:30, plank:60, pushup:20, overhead:15 }]
  //   return Object.fromEntries(sessions.map(s => [s.date, s]));
  // }
  // const data = await loadData();
  // ─────────────────────────────────────────────────────────
  let data = {};
  try { data = JSON.parse(localStorage.getItem('workout_cal_v2') || '{}'); } catch(e) {}

  function dateKey(y, m, d) {
    return `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function todayKey() {
    const t = new Date();
    return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
  }

  let currentDate = new Date();

  function render() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    document.getElementById('month-label').textContent = `${y}년 ${m + 1}월`;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    DAYS.forEach(label => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = label;
      grid.appendChild(el);
    });

    const firstDow = new Date(y, m, 1).getDay();
    const offset   = firstDow === 0 ? 6 : firstDow - 1;
    const total    = new Date(y, m + 1, 0).getDate();
    const tk       = todayKey();

    for (let i = 0; i < offset; i++) {
      const el = document.createElement('div');
      el.className = 'cal-cell empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= total; d++) {
      const key   = dateKey(y, m, d);
      const entry = data[key];
      const kcal  = calcCalories(entry);
      const el    = document.createElement('div');
      el.className = `cal-cell v${colorLevel(kcal)}`;
      if (key === tk) el.classList.add('today');
      el.title = kcal > 0 ? `${kcal} kcal` : '';
      el.addEventListener('click', () => openModal(key, entry));
      grid.appendChild(el);
    }

    updateStats(y, m, total);
  }

  function updateStats(y, m, daysInMonth) {
    let count = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      if (calcCalories(data[dateKey(y, m, d)]) > 0) count++;
    }

    const recordedDates = Object.keys(data)
      .filter(k => calcCalories(data[k]) > 0)
      .sort()
      .reverse();
    let streak = 0;
    if (recordedDates.length > 0) {
      streak = 1;
      for (let i = 1; i < recordedDates.length; i++) {
        const [py, pm, pd] = recordedDates[i - 1].split('-').map(Number);
        const [cy, cm, cd] = recordedDates[i].split('-').map(Number);
        const diff = Math.round(
          (new Date(py, pm - 1, pd) - new Date(cy, cm - 1, cd)) / 86400000
        );
        if (diff === 1) streak++;
        else break;
      }
    }

    const today2 = new Date();
    const ty = today2.getFullYear(), tm = today2.getMonth();
    const isCurrentMonth = (y === ty && m === tm);
    const isPastMonth    = (y < ty) || (y === ty && m < tm);
    const elapsed = isPastMonth ? daysInMonth : (isCurrentMonth ? today2.getDate() : 0);
    const rate = elapsed > 0 ? Math.round(count / elapsed * 100) : 0;

    document.getElementById('header-stat').textContent = count + '일 운동';
  }

  const EXERCISE_META = [
    { key: 'lunge',    icon: '🦵', name: '런지',         unit: '회' },
    { key: 'plank',    icon: '🧘', name: '플랭크',       unit: '초' },
    { key: 'pushup',   icon: '💪', name: '푸쉬업',       unit: '회' },
    { key: 'overhead', icon: '🏋️', name: '오버헤드프레스', unit: '회' },
  ];

  function openModal(key, entry) {
    const [, mm, dd] = key.split('-');
    document.getElementById('modal-title').textContent =
      `${parseInt(mm)}월 ${parseInt(dd)}일 운동 기록`;

    const kcal = calcCalories(entry);
    document.getElementById('modal-kcal').textContent =
      kcal > 0 ? `소모 칼로리: ${kcal} kcal` : '';

    const list = document.getElementById('modal-exercise-list');
    list.innerHTML = '';

    if (!entry || kcal === 0) {
      const el = document.createElement('div');
      el.className = 'no-record';
      el.textContent = '운동 기록이 없습니다';
      list.appendChild(el);
    } else {
      EXERCISE_META.forEach(({ key: k, icon, name, unit }) => {
        const val = entry[k] || 0;
        if (val <= 0) return;
        const row = document.createElement('div');
        row.className = 'exercise-row';
        row.innerHTML = `
          <div class="exercise-left">
            <span class="exercise-icon">${icon}</span>
            <span class="exercise-name">${name}</span>
          </div>
          <span class="exercise-value">${val} ${unit}</span>
        `;
        list.appendChild(row);
      });
    }

    document.getElementById('modal').classList.add('open');
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal').classList.remove('open');
  });
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  document.getElementById('prev-btn').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1); render();
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1); render();
  });

  render();
</script>
</body>
</html>
